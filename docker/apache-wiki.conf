# Installed as /etc/apache2/conf-enabled/wiki.conf (loaded after the base image's security.conf).
# Only what the browser needs is served: PHP entry points, resources, skins/extensions assets,
# fonts, theme, branding, robots.txt.

ServerTokens Prod
ServerSignature Off

# Uploads are served by img_auth.php ($wgUploadPath), which checks read rights. Never directly.
# Server-side files that are not needed over HTTP (and the web installer) are not served either.
<DirectoryMatch "^/var/www/html/(images|cache|docs|maintenance|mw-config|tests|vendor)(/|$)">
	AllowOverride None
	Require all denied
</DirectoryMatch>

<Directory /var/www/html>
	# Dotfiles anywhere (.htaccess, .pinned-sha, .eslintrc, ...)
	<FilesMatch "^\.">
		Require all denied
	</FilesMatch>
	# Metadata that discloses versions: READMEs, changelogs, release notes, package manifests
	<FilesMatch "(?i)^(README|CHANGELOG|CHANGES|HISTORY|RELEASE-NOTES|UPGRADE|INSTALL|FAQ|SECURITY|CREDITS|AUTHORS|COPYING|CODE_OF_CONDUCT)([.-].*)?$|\.(md|txt|lock|neon|dist)$|^composer\.|^(package|package-lock|extension|skin|bundlesize\.config|jsdoc)\.json$|^Gruntfile\.js$">
		Require all denied
	</FilesMatch>
	<Files robots.txt>
		Require all granted
	</Files>
</Directory>
