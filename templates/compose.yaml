# One wiki: MySQL and MediaWiki with Semantic MediaWiki. Generated by scripts/new-wiki.sh from
# templates/compose.yaml; this copy belongs to the wiki and is never changed by updates of the stack
# repository (compare it with the template after an update and merge by hand if you want).
#
# Self-contained: the configuration is in the image, so this folder (compose.yaml, .env, branding/,
# settings.php) runs anywhere with plain `docker compose` from inside it, or through the repository's
# scripts (scripts/compose.sh <name> ...). All values come from .env next to this file.
# Each container gets only the variables it needs (never the whole .env): the wiki never sees the DB
# root password or the admin password.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-wiki}
      MYSQL_USER: ${DB_USER:-wiki}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql   # data storage: see the end of this file
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Apache plus the job queue loop; the image's entrypoint runs update.php first when the image or
  # the configuration changed.
  wiki:
    # A locally built image (mediawiki-smw, built by the scripts from the repository) or the published
    # one (ghcr.io/<owner>/<repo>). Watchtower follows a floating WIKI_TAG; pin an immutable tag to
    # roll back. On a machine with the repository checked out at ../.. you can also uncomment `build`
    # and use `docker compose build`; a wiki folder copied to a server uses `image` only.
    image: ${WIKI_IMAGE:?set WIKI_IMAGE in .env}:${WIKI_TAG:?set WIKI_TAG in .env}
    # build: ../..
    environment:
      TZ: ${WIKI_TIMEZONE:-UTC}   # log timestamps; MediaWiki itself uses $wgLocaltimezone
      WIKI_SERVER: ${WIKI_SERVER:?set WIKI_SERVER in .env}
      WIKI_NAME: ${WIKI_NAME:-Wiki}
      WIKI_LANG: ${WIKI_LANG:-en}
      WIKI_TIMEZONE: ${WIKI_TIMEZONE:-UTC}
      WIKI_DATE_FORMAT: ${WIKI_DATE_FORMAT:-dmy}
      WIKI_DEFAULT_THEME: ${WIKI_DEFAULT_THEME:-os}
      WIKI_FONT: ${WIKI_FONT:-roboto}
      WIKI_ARTICLE_PATH: ${WIKI_ARTICLE_PATH:-/wiki}
      WIKI_DEBUG: ${WIKI_DEBUG:-0}
      DB_NAME: ${DB_NAME:-wiki}
      DB_USER: ${DB_USER:-wiki}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      WIKI_SECRET_KEY: ${WIKI_SECRET_KEY:?set WIKI_SECRET_KEY in .env (openssl rand -hex 32)}
      WIKI_UPGRADE_KEY: ${WIKI_UPGRADE_KEY:?set WIKI_UPGRADE_KEY in .env (openssl rand -hex 32)}
      WIKI_OATH_KEY: ${WIKI_OATH_KEY:-}
      JOB_RUNNER_INTERVAL: ${JOB_RUNNER_INTERVAL:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      WIKI_EMAIL_FROM: ${WIKI_EMAIL_FROM:-}
      # Reverse proxies whose X-Forwarded-For is trusted: IPs/CIDRs, or "private" (see the Traefik block)
      WIKI_TRUSTED_PROXIES: ${WIKI_TRUSTED_PROXIES:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # This wiki's files, both required (they may stay empty): branding files served at /branding,
      # and settings.php, included last by the image's LocalSettings.php
      - ./branding:/var/www/html/branding:ro
      - ./settings.php:/config/instance.php:ro
      - images:/var/www/html/images   # uploads (all of them, also old versions and deleted files)
      - wiki-state:/var/lib/wiki-state   # update stamp and lock (a few bytes)
    healthcheck:
      # Healthy once update.php is done and MediaWiki answers (the login page is public)
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/index.php?title=Special:UserLogin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10m
      start_interval: 5s
    restart: unless-stopped

    # --- Local access: a host port, loopback only unless WIKI_BIND=0.0.0.0 -------------------------
    # Comment these two lines out when you enable the Traefik block below.
    ports:
      - "${WIKI_BIND:-127.0.0.1}:${WIKI_PORT:?set WIKI_PORT in .env}:80"

    # --- Production behind Traefik --------------------------------------------------------------
    # To serve the wiki through Traefik instead of a host port:
    #   1. comment out `ports:` above, uncomment `networks:` and `labels:` below and the top-level
    #      `networks:` block at the end of this file;
    #   2. in .env set WIKI_SERVER=https://<host> (https also forces HTTPS and secure cookies),
    #      WIKI_HOST=<host>, TRAEFIK_CERTRESOLVER, and if they differ from the defaults TRAEFIK_NETWORK
    #      (the external network Traefik watches; default "web") and TRAEFIK_ENTRYPOINT ("websecure");
    #   3. set WIKI_TRUSTED_PROXIES so client IPs come from Traefik's X-Forwarded-For: the subnet of
    #      the Traefik network (`docker network inspect <TRAEFIK_NETWORK>`), or "private" for all
    #      private networks. Leave it empty only when no proxy is in front.
    # Router and service are named after the compose project, so several wikis can share one Traefik.
    # One-off containers started by the scripts carry traefik.enable=false and are never routed to.
    # networks: [default, proxy]
    # labels:
    #   - traefik.enable=true
    #   - traefik.docker.network=${TRAEFIK_NETWORK:-web}
    #   - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${WIKI_HOST:?set WIKI_HOST in .env}`)
    #   - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
    #   - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls=true
    #   - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env}
    #   - traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}
    #   - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80

# networks:
#   proxy:
#     name: ${TRAEFIK_NETWORK:-web}
#     external: true

# Data storage: Docker named volumes (<project>_db-data, _images, _wiki-state), managed by Docker.
# To keep the data in folders next to this file instead (visible, easy to include in file-level
# backups): replace the three mounts above with
#   ./data/db:/var/lib/mysql      ./data/images:/var/www/html/images      ./data/state:/var/lib/wiki-state
# and delete the `volumes:` block below. Create the folders first (mkdir -p data/db data/images
# data/state, mode 700) and move the existing data over with scripts/backup.sh and restore.sh.
volumes:
  db-data:
  images:
  wiki-state:
